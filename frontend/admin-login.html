<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin sign in · Sonnad Studio</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="auth-page auth-admin">
  <main class="auth-wrap">
    <section class="auth-admin-card">
      <a href="/" class="logo footer-logo auth-logo" id="authLogo" aria-label="View store">
        <span class="logo-word">
          S<svg class="logo-compass" viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="50" r="34" class="ring" />
            <circle cx="50" cy="50" r="28" class="ring-inner" />
            <polygon points="50,2 55,45 50,50 45,45" class="pt-a" />
            <polygon points="50,98 55,55 50,50 45,55" class="pt-b" />
            <polygon points="2,50 45,45 50,50 45,55" class="pt-b" />
            <polygon points="98,50 55,55 50,50 55,45" class="pt-a" />
            <polygon points="22,22 47,44 50,50 44,47" class="pt-c" />
            <polygon points="78,22 56,47 50,50 53,44" class="pt-c" />
            <polygon points="22,78 44,53 50,50 47,56" class="pt-c" />
            <polygon points="78,78 53,56 50,50 56,53" class="pt-c" />
            <circle cx="50" cy="50" r="4" class="hub" />
          </svg>NNAD
        </span>
        <span class="logo-sub">STUDIO</span>
      </a>

      <div class="auth-admin-box">
        <span class="auth-badge"><svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>Admin Panel</span>
        <h1>Admin sign in</h1>
        <p class="auth-sub">Sign in to manage products, orders and settings.</p>
        <p class="auth-note" id="authNote" hidden></p>

        <form id="adminLoginForm" novalidate>
          <label>Admin email
            <span class="auth-input"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input type="email" name="email" required placeholder="admin@yourstore.com" autocomplete="username" /></span>
          </label>
          <label>Password
            <span class="auth-input"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input type="password" name="password" required placeholder="Your admin password" autocomplete="current-password" />
              <button type="button" class="auth-eye" data-eye aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="3"/></svg></button></span>
          </label>
          <p class="form-error" id="adminLoginError" role="alert" hidden></p>
          <button type="submit" class="auth-submit" id="adminLoginBtn">
            <svg viewBox="0 0 24 24"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l5-5-5-5M15 12H3"/></svg>Sign in to Admin
          </button>
        </form>
      </div>

    </section>
  </main>

  <script>window.API_PANEL = "admin";</script>
  <script src="/env.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/admin-login.js"></script>
</body>
</html>
