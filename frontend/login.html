<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Sonnad Studio</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="auth-page auth-shop">
  <main class="auth-wrap">
    <section class="auth-card">
      <!-- Brand side -->
      <aside class="auth-brand">
        <a href="/" class="logo footer-logo auth-logo" id="authLogo" aria-label="Back to store">
          <span class="logo-word">
            S<svg class="logo-compass" viewBox="0 0 100 100" aria-hidden="true">
              <circle cx="50" cy="50" r="34" class="ring" />
              <circle cx="50" cy="50" r="28" class="ring-inner" />
              <polygon points="50,2 55,45 50,50 45,45" class="pt-a" />
              <polygon points="50,98 55,55 50,50 45,55" class="pt-b" />
              <polygon points="2,50 45,45 50,50 45,55" class="pt-b" />
              <polygon points="98,50 55,55 50,50 55,45" class="pt-a" />
              <polygon points="22,22 47,44 50,50 44,47" class="pt-c" />
              <polygon points="78,22 56,47 50,50 53,44" class="pt-c" />
              <polygon points="22,78 44,53 50,50 47,56" class="pt-c" />
              <polygon points="78,78 53,56 50,50 56,53" class="pt-c" />
              <circle cx="50" cy="50" r="4" class="hub" />
            </svg>NNAD
          </span>
          <span class="logo-sub">STUDIO</span>
        </a>
        <!-- Filled from Admin → Settings: store name, footer "About" text, "Why choose us" list -->
        <h2 class="auth-brand-title">Welcome to <span class="auth-store-name"></span></h2>
        <p class="auth-brand-text" id="authBrandText" hidden></p>
        <ul class="auth-perks" id="authPerks" hidden></ul>
      </aside>

      <!-- Form side -->
      <div class="auth-form-side">
        <a href="/" class="auth-back" id="authBack"><svg viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></svg>Back to store</a>
        <div class="auth-tabs" role="tablist">
          <button type="button" role="tab" data-mode="login" aria-selected="true" class="on">Sign in</button>
          <button type="button" role="tab" data-mode="register" aria-selected="false">Create account</button>
        </div>
        <h1 id="authTitle">Sign in to your account</h1>
        <p class="auth-sub" id="authSub">Welcome back! Please enter your details.</p>

        <form id="authForm" novalidate>
          <label id="nameField" hidden>Full name
            <span class="auth-input"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><input type="text" name="name" placeholder="Your name" autocomplete="name" /></span>
          </label>
          <label>Email
            <span class="auth-input"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input type="email" name="email" required placeholder="you@example.com" autocomplete="email" /></span>
          </label>
          <label>Password
            <span class="auth-input"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input type="password" name="password" required minlength="6" placeholder="At least 6 characters" autocomplete="current-password" />
              <button type="button" class="auth-eye" data-eye aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="3"/></svg></button></span>
          </label>
          <p class="form-error" id="authError" role="alert" hidden></p>
          <button type="submit" class="auth-submit" id="authSubmit">Sign in</button>
        </form>
        <p class="auth-switch" id="authSwitch"></p>
      </div>
    </section>
  </main>

  <script src="/env.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
